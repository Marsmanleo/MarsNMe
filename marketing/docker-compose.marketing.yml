# MarsNMe Marketing Stack — Listmonk (self-hosted newsletter)
#
# Usage:
#   cp marketing/listmonk/config.toml.example marketing/listmonk/config.toml
#   # Edit config.toml with your SMTP settings
#   docker compose -f marketing/docker-compose.marketing.yml up -d
#
# Access: http://localhost:9000
# Default admin: admin / admin (change immediately)

services:
  listmonk-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: listmonk
      POSTGRES_DB: listmonk
    volumes:
      - listmonk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 5s
      timeout: 5s
      retries: 20

  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    depends_on:
      listmonk-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./listmonk/config.toml:/listmonk/config.toml:ro
    command: ["/bin/sh", "-c", "/listmonk/listmonk --install --idempotent --yes && /listmonk/listmonk"]

volumes:
  listmonk-pgdata:
