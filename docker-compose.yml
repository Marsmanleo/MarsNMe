services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - marsnme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: pgvector/pgvector:pg16
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    command: ["/bin/sh", "/migrate.sh"]
    restart: "no"

  rest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,extensions,coco,toto
      PGRST_DB_ANON_ROLE: postgres
      PGRST_SERVER_PORT: 3000
      PGRST_JWT_SECRET: docker-local-dev-jwt-secret-at-least-32-characters!!
      PGRST_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:8100

  rest-proxy:
    image: node:20
    depends_on:
      rest:
        condition: service_started
    environment:
      PROXY_TARGET_HOST: rest
      PROXY_TARGET_PORT: 3000
      MCP_PROFILE: ${MCP_PROFILE:-coco}
      PROXY_PORT: 3001
    volumes:
      - ./docker/rest-proxy.mjs:/rest-proxy.mjs:ro
    command: ["node", "/rest-proxy.mjs"]
    ports:
      - "127.0.0.1:8100:3001"

  marsnme:
    image: node:20
    working_dir: /workspace
    depends_on:
      rest:
        condition: service_started
    environment:
      MCP_PROFILE: ${MCP_PROFILE:-coco}
      PORT: 18790
      SUPABASE_BASE_URL: http://rest-proxy:3001
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoicG9zdGdyZXMiLCJpc3MiOiJtYXJzbm1lLWxvY2FsIiwiaWF0IjoxNzc5NDQwMDM1fQ.KC891-7yQ1lG70pVP-2r-vNO_bUuemlIzlrX0zgoC-0}
      MCP_REQUIRE_BEARER: "false"
      JINA_API_KEY: ${JINA_API_KEY}
    command: ["/bin/sh", "-lc", "npx -y @marsnme/mcp-gateway@latest"]
    ports:
      - "127.0.0.1:18790:18790"

  marsnme-tunnel:
    image: node:20
    profiles: ["tunnel"]
    working_dir: /workspace
    depends_on:
      rest:
        condition: service_started
    environment:
      MCP_PROFILE: ${MCP_TUNNEL_PROFILE:-coco}
      PORT: 18790
      SUPABASE_BASE_URL: http://rest-proxy:3001
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoicG9zdGdyZXMiLCJpc3MiOiJtYXJzbm1lLWxvY2FsIiwiaWF0IjoxNzc5NDQwMDM1fQ.KC891-7yQ1lG70pVP-2r-vNO_bUuemlIzlrX0zgoC-0}
      MCP_REQUIRE_BEARER: ${MCP_TUNNEL_REQUIRE_BEARER:-false}
      JINA_API_KEY: ${JINA_API_KEY}
    command: ["/bin/sh", "-lc", "npx -y @marsnme/mcp-gateway@latest"]

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    depends_on:
      marsnme-tunnel:
        condition: service_started
    environment:
      TARGET_URL: http://marsnme-tunnel:18790
    command: ["tunnel", "--no-autoupdate", "--url", "http://marsnme-tunnel:18790"]
    restart: unless-stopped

volumes:
  marsnme-pgdata:
